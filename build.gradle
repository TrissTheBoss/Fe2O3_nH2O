plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    // Development/test harness only; production code has no Fabric API references.
    implementation 'net.fabricmc.fabric-api:fabric-api:0.161.0+26.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.13.4'
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'fe2o3-client-tests'
        enableGameTests = false
        enableClientGameTests = true
    }
}

dependencies {
    productionRuntimeMods 'net.fabricmc.fabric-api:fabric-api:0.161.0+26.2'
}

tasks.register('clientGameTestJar', Jar) {
    archiveClassifier = 'gametest'
    from sourceSets.gametest.output
}

tasks.register('runProductionClientGameTest', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    // Production runs only load explicitly supplied mod JARs.
    mods.from(tasks.named('clientGameTestJar'))
    runDir = layout.buildDirectory.dir('run/clientGameTest')
    jvmArgs.addAll('-Dfabric.client.gametest', '-Dfe2o3.minPixels=4', '-Dfe2o3.blaze3dOutline=true',
        '-Dfabric.client.gametest.disableNetworkSynchronizer=true')
    useXVFB = true
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
    from('build/native') { into 'natives' }
}
jar { from('LICENSE'); from('NOTICE.md') }
test {
    useJUnitPlatform()
    systemProperty 'fe2o3.minPixels', '4'
    systemProperty 'fe2o3.requireGpu', System.getenv('FE2O3_REQUIRE_GPU') ?: 'false'
    systemProperty 'fe2o3.benchmarkMipmaps', System.getProperty('fe2o3.benchmarkMipmaps') ?: 'false'
    testLogging { events 'passed', 'skipped', 'failed'; showStandardStreams = true }
}

