name: Build and verify
# Native builds feed the mandatory Minecraft differential tests.
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Rust
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Native checks and build
        shell: bash
        run: |
          cargo fmt --manifest-path native/Cargo.toml
          cargo test --manifest-path native/Cargo.toml
          cargo clippy --manifest-path native/Cargo.toml --all-targets -- -D warnings
          cargo build --manifest-path native/Cargo.toml --release
          python tools/stage_native.py
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: build/native/
          if-no-files-found: error
          retention-days: 14
      - name: Export bootstrap lock and formatting
        if: runner.os == 'Linux'
        run: |
          python3 - <<'PY'
          import json, pathlib
          print('BOOTSTRAP_FILES=' + json.dumps({p: pathlib.Path(p).read_text() for p in ['native/Cargo.lock', 'native/src/lib.rs']}))
          PY
  verify:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FE2O3_REQUIRE_GPU: 'true'
      XDG_RUNTIME_DIR: /tmp/fe2o3-runtime
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: build/native
          merge-multiple: true
      - name: Install software Vulkan for mandatory GPU parity tests
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
      - name: Build Fabric JAR and run vanilla differential tests
        run: gradle --no-daemon build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: build/reports/tests/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: fe2o3-nh2o-26.2
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
