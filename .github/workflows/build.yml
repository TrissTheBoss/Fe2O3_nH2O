name: Build and verify
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
    tags: ['v*']
    paths: ['native/**', 'src/**', 'tools/**', '*.gradle', 'gradle.properties', 'rust-toolchain.toml', '.github/workflows/**']
  pull_request:
    paths: ['native/**', 'src/**', 'tools/**', '*.gradle', 'gradle.properties', 'rust-toolchain.toml', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install pinned Rust
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/Cargo.lock', 'rust-toolchain.toml') }}
      - name: Native checks and build
        shell: bash
        run: |
          cargo fmt --manifest-path native/Cargo.toml -- --check
          cargo test --locked --manifest-path native/Cargo.toml
          cargo clippy --locked --manifest-path native/Cargo.toml --all-targets -- -D warnings
          cargo build --locked --manifest-path native/Cargo.toml --release
          python tools/stage_native.py
      - name: Generate bundled third-party licenses
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo install --locked --features cli cargo-about --version 0.9.2
          mkdir -p build/native/licenses
          cargo about generate --locked --fail --manifest-path native/Cargo.toml native/about.hbs > build/native/licenses/third-party.html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-${{ matrix.os }}
          path: build/native/
          if-no-files-found: error
          retention-days: 14
  verify:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FE2O3_REQUIRE_GPU: 'true'
      XDG_RUNTIME_DIR: /tmp/fe2o3-runtime
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '9.5.1'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-*
          path: build/native
          merge-multiple: true
      - name: Install software Vulkan for mandatory GPU parity tests
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers xvfb libgl1-mesa-dri
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
      - name: Build Fabric JAR and run vanilla differential tests
        run: gradle --no-daemon build
      - name: Verify packaged native payloads and checksums
        run: python3 tools/verify_jar.py
      - name: Launch Minecraft and verify live Mixin, scene and reload
        run: |
          rm -f build/run/clientGameTest/FE2O3_CLIENT_TEST_PASSED
          gradle --no-daemon runProductionClientGameTest
          test -s build/run/clientGameTest/FE2O3_CLIENT_TEST_PASSED
          mapfile -t screenshots < <(find build/run -type f -name '*.png' -size +0c | sort)
          printf '%s\n' "${screenshots[@]}"
          test "${#screenshots[@]}" -ge 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verification-reports
          path: |
            build/reports/tests/
            build/test-results/
            build/run/**/screenshots/
            build/run/**/logs/
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fe2o3-nh2o-26.2
          path: build/distributions/*
          if-no-files-found: error
          retention-days: 30

  publish-prerelease:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: fe2o3-nh2o-26.2
          path: release-assets
      - name: Validate alpha tag, source and archive
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version=//p' gradle.properties)
          tag=${GITHUB_REF_NAME}
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$ ]]; then
            echo "Automated publishing is limited to alpha, beta and release-candidate versions: $version" >&2
            exit 1
          fi
          if [[ "$tag" != "v$version" ]]; then
            echo "Tag $tag must match version $version in gradle.properties" >&2
            exit 1
          fi
          git fetch origin main:refs/remotes/origin/main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          jar="fe2o3-nh2o-$version.jar"
          test -s "release-assets/$jar"
          test -s "release-assets/$jar.sha256"
          (cd release-assets && sha256sum --check "$jar.sha256")
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version=//p' gradle.properties)
          tag=${GITHUB_REF_NAME}
          jar="release-assets/fe2o3-nh2o-$version.jar"
          checksum="$jar.sha256"
          cat > release-notes.md <<EOF
          Experimental prerelease for Minecraft Java 26.2 on Fabric.

          This build accelerates only eligible MEAN texture mipmap generation. It does not replace world drawing and does not claim complete vanilla or resource-pack parity or an FPS improvement. See README.md and docs/RELEASES.md before installing.

          CI verified the tagged source with the repository's four-target native build, mandatory software-Vulkan differential tests, packaged JAR checks and live client smoke test. The software Vulkan result is not a physical-GPU performance benchmark.

          Source commit: $GITHUB_SHA
          Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
          gh release create "$tag" "$jar" "$checksum" \
            --verify-tag --prerelease --title "$tag" \
            --notes-file release-notes.md
