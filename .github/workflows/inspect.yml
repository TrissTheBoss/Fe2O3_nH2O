name: Inspect upstream interfaces
on:
  push:
    paths: ['.github/workflows/inspect.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Inspect upstream release metadata and bytecode
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, subprocess, zipfile
          def get(url):
              with urllib.request.urlopen(url, timeout=60) as r:
                  return r.read()
          manifest=json.loads(get("https://piston-meta.mojang.com/mc/game/version_manifest_v2.json"))
          release=next(v for v in manifest["versions"] if v["id"]=="26.2")
          version=json.loads(get(release["url"]))
          print("JAVA", version["javaVersion"])
          open("client.jar","wb").write(get(version["downloads"]["client"]["url"]))
          for cls in ["net.minecraft.client.renderer.texture.MipmapGenerator","com.mojang.blaze3d.platform.NativeImage","net.minecraft.client.renderer.texture.SpriteContents"]:
              print("\nAPI", cls, flush=True)
              subprocess.run(["javap","-classpath","client.jar","-p","-c",cls],check=True)
          for url in ["https://maven.fabricmc.net/net/fabricmc/fabric-loom/maven-metadata.xml","https://meta.fabricmc.net/v2/versions/loader/26.2","https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml"]:
              data=get(url).decode()
              if "metadata" in url:
                  import xml.etree.ElementTree as ET
                  versions=[v.text for v in ET.fromstring(data).findall("./versioning/versions/version")]
                  print(url,[v for v in versions if ("1.17" in v if "loom" in url else v.endswith("+26.2"))][-10:])
              else:
                  print(url,json.loads(data)[0]["loader"]["version"])
          PY
